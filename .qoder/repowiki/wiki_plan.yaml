knowledgecard:
  notes:
    - text: "后端代码在 backend_api_python/ 下，核心入口是 app/__init__.py::create_app()。路由注册在 app/routes/__init__.py::register_routes()。Agent 路由在 app/routes/agent_v1/ 独立蓝图。"
    - text: "Service 层在 app/services/ 下，是两套 API 共享的唯一业务逻辑源。执行层分四个适配器：exchange_execution.py（CCXT）、ibkr_trading/、mt5_trading/、alpaca_trading/。"
    - text: "策略运行时：IndicatorStrategy 向量化 DataFrame 信号，回测在 app/services/backtest.py；ScriptStrategy 事件驱动 on_bar，运行时在 app/services/strategy_script_runtime.py。"
    - text: "数据层：app/data_sources/ 是市场特定 OHLCV 获取器（带熔断），app/data_providers/ 是高层聚合（新闻、情绪、日历）。工厂在 data_sources/factory.py。"
    - text: "数据库 Schema 在 migrations/init.sql，所有 CREATE TABLE IF NOT EXISTS。连接池在 app/utils/db_postgres.py（psycopg2 ThreadedConnectionPool）。"
    - text: "安全相关：safe_exec.py 沙箱执行策略代码，Fernet 加密交易所凭证（密钥来自 SECRET_KEY），Agent Token 默认 paper_only=true。"
