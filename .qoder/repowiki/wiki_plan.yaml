repowiki:
  template: architecture
  notes:
    - text: "QuantDinger 是自托管 AI 量化交易基础设施，版本 4.0.1。后端 Python 3.12 / Flask / Gunicorn，数据库 PostgreSQL 16 + Redis 7，前端 Vue SPA（独立仓库，GHCR 预构建镜像），MCP Server 为独立 Python 包。"
    - text: "核心架构原则：两套 API（人类 Web API + Agent Gateway）共享同一套 Service 层，Service 是唯一业务逻辑源。Agent Gateway 不是平行实现，仅是薄认证层。"
    - text: "所有数据库表以 qd_ 为前缀（如 qd_users, qd_strategies, qd_agent_tokens）。Schema 定义在 migrations/init.sql，启动时幂等执行。"
    - text: "凭证加密使用 Fernet，密钥由 SECRET_KEY 派生。禁止随意更换 SECRET_KEY，否则所有存储的交易所密钥失效。"
    - text: "并发模型：Gunicorn 默认 1 worker + 8 threads，preload_app=False。后台线程在 worker 进程中启动，不在 master。"
    - text: "策略代码通过 app/utils/safe_exec.py 沙箱执行，使用 restricted builtins。IndicatorStrategy 操作 DataFrame，ScriptStrategy 通过事件驱动 ctx 对象。"
  documents:
