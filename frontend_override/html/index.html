<!DOCTYPE html>

  <head>

    <title>ChanQuant</title>
    <style>
      :root {
        color-scheme: light dark;
        --primary-color: #13C2C2;
        --primary-color-hover: #36CFC9;
        --primary-color-active: #08979C;
        --primary-color-soft: rgba(19, 194, 194, 0.12);
        --antd-wave-shadow-color: #13C2C2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* ChanQuant theme for login/register before layout theme replacer runs */
      .ant-btn-primary {
        background-color: #13C2C2 !important;
        border-color: #13C2C2 !important;
      }
      .ant-btn-primary:hover,
      .ant-btn-primary:focus {
        background-color: #36CFC9 !important;
        border-color: #36CFC9 !important;
      }
      .ant-tabs-ink-bar,
      .ant-tabs-nav .ant-tabs-ink-bar {
        background: #13C2C2 !important;
      }
      .ant-tabs-tab.ant-tabs-tab-active .ant-tabs-tab-btn {
        color: #13C2C2 !important;
      }
      .ant-checkbox-checked .ant-checkbox-inner,
      .ant-checkbox-indeterminate .ant-checkbox-inner {
        background-color: #13C2C2 !important;
        border-color: #13C2C2 !important;
      }
      .ant-checkbox-wrapper:hover .ant-checkbox-inner,
      .ant-checkbox:hover .ant-checkbox-inner,
      .ant-input:hover,
      .ant-input:focus,
      .ant-input-affix-wrapper:hover,
      .ant-input-affix-wrapper-focused {
        border-color: #13C2C2 !important;
      }
      a {
        color: #13C2C2;
      }

      .first-loading-wrp {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        color: #111827;
        background:
          linear-gradient(135deg, rgba(19, 194, 194, 0.10), rgba(26, 26, 46, 0.06)),
          #f8fbff;
      }

      .first-loading-card {
        width: min(420px, 100%);
        display: grid;
        justify-items: center;
        gap: 18px;
        padding: 36px 34px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(16px);
      }

      .brand-mark {
        width: 104px;
        height: 104px;
        object-fit: contain;
        filter: drop-shadow(0 18px 32px rgba(19, 194, 194, 0.22));
        animation: qdFloat 2.8s ease-in-out infinite;
      }

      .brand-title {
        margin: 2px 0 0;
        color: #0f172a;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .brand-subtitle {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
      }

      .loading-line {
        width: 220px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(19, 194, 194, 0.14);
      }

      .loading-line::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #13C2C2, #08979C);
        animation: qdLoad 1.15s ease-in-out infinite;
      }

      .loading-copy {
        margin: 0;
        color: #64748b;
        font-size: 13px;
      }

      @keyframes qdLoad {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      @keyframes qdFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @media (prefers-color-scheme: dark) {
        .first-loading-wrp {
          color: #f8fafc;
          background:
            linear-gradient(135deg, rgba(19, 194, 194, 0.16), rgba(26, 26, 46, 0.4)),
            #0b1120;
        }

        .first-loading-card {
          border-color: rgba(148, 163, 184, 0.2);
          background: rgba(15, 23, 42, 0.78);
          box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        }

        .brand-title {
          color: #f8fafc;
        }

        .brand-subtitle,
        .loading-copy {
          color: #94a3b8;
        }
      }

      @media (max-width: 640px) {
        .first-loading-card {
          padding: 30px 22px;
        }

        .brand-mark {
          width: 88px;
          height: 88px;
        }

        .brand-title {
          font-size: 26px;
        }
      }
    </style>

    <div id="app">
      <div class="first-loading-wrp">
        <div class="first-loading-card">
