<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ChanQuant - 策略监控面板</title>
<style>
:root {
  --bg: #0a0e1a;
  --bg-card: #111827;
  --bg-card-hover: #1a2332;
  --bg-header: #0f1629;
  --border: #1e2d3d;
  --border-light: #2a3a4d;
  --text: #e2e8f0;
  --text-dim: #8b9dc3;
  --text-muted: #5a6a82;
  --accent: #13C2C2;
  --accent-glow: rgba(19,194,194,0.15);
  --green: #22c55e;
  --green-bg: rgba(34,197,94,0.1);
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.1);
  --yellow: #eab308;
  --yellow-bg: rgba(234,179,8,0.12);
  --purple: #a78bfa;
  --purple-bg: rgba(167,139,250,0.1);
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
}

* { box-sizing: border-box; margin: 0; padding: 0 }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  height: 64px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(12px);
}
.header-left { display: flex; align-items: center; gap: 14px }
.header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px }
.header h1 span { color: var(--accent); }
.pulse-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4) }
  50% { box-shadow: 0 0 0 6px rgba(34,197,94,0) }
}
.header-right { display: flex; align-items: center; gap: 16px }
.last-update { font-size: 12px; color: var(--text-muted) }
.btn-refresh {
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--border-light); padding: 7px 14px;
  border-radius: 8px; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; gap: 6px;
  transition: all .2s;
}
.btn-refresh:hover { color: var(--text); border-color: var(--accent); background: var(--accent-glow) }
.btn-refresh.loading svg { animation: spin 1s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }

/* ── Tabs ── */
.tabs-bar {
  display: flex; gap: 2px; padding: 0 32px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
}
.tab {
  padding: 12px 18px; cursor: pointer;
  border-bottom: 2px solid transparent;
  color: var(--text-muted); font-size: 13px; font-weight: 500;
  transition: all .2s; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--text-dim) }
.tab.active { color: var(--accent); border-bottom-color: var(--accent) }
.tab .count {
  font-size: 11px; padding: 1px 6px; border-radius: 8px;
  background: var(--border); color: var(--text-muted); font-weight: 600;
}
.tab.active .count { background: var(--accent-glow); color: var(--accent) }

/* ── Content ── */
.content { padding: 28px 32px; max-width: 1440px; margin: 0 auto }

/* ── Summary Row ── */
.summary-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  transition: border-color .2s;
}
.stat-card:hover { border-color: var(--border-light) }
.stat-label {
  font-size: 11px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.8px;
  font-weight: 600; margin-bottom: 8px;
}
.stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1 }
.stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px }

/* ── Market Cards ── */
.market-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 28px;
}
.market-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 24px;
  position: relative;
  overflow: hidden;
}
.market-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.market-card.crypto::before { background: linear-gradient(90deg, var(--yellow), #f97316) }
.market-card.cnstock::before { background: linear-gradient(90deg, var(--green), #06b6d4) }
.market-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
}
.market-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.crypto .market-icon { background: var(--yellow-bg) }
.cnstock .market-icon { background: var(--green-bg) }
.market-title { font-size: 15px; font-weight: 600 }
.market-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 1px }
.metrics-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
}
.metric-item {}
.metric-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px }
.metric-value { font-size: 17px; font-weight: 600 }

/* ── Table ── */
.table-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.table-title {
  padding: 16px 20px; font-size: 14px; font-weight: 600;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.table-title .count-badge {
  font-size: 12px; color: var(--text-muted); font-weight: 400;
}
table { width: 100%; border-collapse: collapse }
th {
  text-align: left; padding: 10px 16px;
  font-size: 11px; color: var(--text-muted);
  font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.6px;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.15);
}
td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border) }
tr:last-child td { border-bottom: none }
tbody tr { transition: background .15s }
tbody tr:hover { background: var(--bg-card-hover) }

.status-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
.status-pill .dot { width: 6px; height: 6px; border-radius: 50% }
.pill-running { background: var(--green-bg); color: var(--green) }
.pill-running .dot { background: var(--green) }
.pill-stopped { background: rgba(100,116,139,0.12); color: var(--text-muted) }
.pill-stopped .dot { background: var(--text-muted) }

.mode-tag {
  font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600;
}
.mode-tag.live { background: var(--yellow-bg); color: var(--yellow) }
.mode-tag.signal { background: var(--purple-bg); color: var(--purple) }

/* ── Helpers ── */
.pnl-pos { color: var(--green) }
.pnl-neg { color: var(--red) }
.text-dim { color: var(--text-dim) }
.text-muted { color: var(--text-muted) }

/* ── Login ── */
.login-wrap {
  min-height: 100vh; display: flex;
  align-items: center; justify-content: center;
  background: var(--bg);
}
.login-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  width: 380px;
}
.login-box h2 {
  text-align: center; margin-bottom: 8px; font-size: 22px;
}
.login-box .subtitle {
  text-align: center; color: var(--text-muted);
  font-size: 13px; margin-bottom: 28px;
}
.login-box input {
  width: 100%; padding: 11px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font-size: 14px;
  margin-bottom: 12px; outline: none;
  transition: border-color .2s;
}
.login-box input:focus { border-color: var(--accent) }
.login-box button {
  width: 100%; padding: 12px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 8px;
  font-size: 14px; cursor: pointer; font-weight: 600;
  transition: opacity .2s; margin-top: 4px;
}
.login-box button:hover { opacity: 0.88 }
.login-err { color: var(--red); font-size: 13px; margin-bottom: 12px; text-align: center }

.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--text-muted); font-size: 14px;
}
.empty-state .icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5 }

/* ── Ranking Section ── */
.ranking-section {
  margin-bottom: 28px;
}
.ranking-title {
  font-size: 14px; font-weight: 600; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.ranking-title .icon { font-size: 18px }
.ranking-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}
.rank-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.rank-card:hover { border-color: var(--accent); background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3) }
.rank-card .rank-badge {
  position: absolute; top: 10px; right: 12px;
  font-size: 20px; font-weight: 800; color: var(--border-light); opacity: 0.5;
}
.rank-card:nth-child(1) .rank-badge { color: #fbbf24; opacity: 0.8 }
.rank-card:nth-child(2) .rank-badge { color: #94a3b8; opacity: 0.8 }
.rank-card:nth-child(3) .rank-badge { color: #cd7f32; opacity: 0.8 }
.rank-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px }
.rank-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 10px }
.rank-stats { display: flex; gap: 16px }
.rank-stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px }
.rank-stat-value { font-size: 15px; font-weight: 700; margin-top: 2px }

/* ── Strategy Detail View ── */
.detail-view { padding: 0 }
.detail-back {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; color: var(--text-dim); border: 1px solid var(--border-light);
  padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
  transition: all .2s; margin-bottom: 20px;
}
.detail-back:hover { color: var(--text); border-color: var(--accent); background: var(--accent-glow) }
.detail-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
}
.detail-header-left { display: flex; align-items: center; gap: 16px }
.detail-header h2 { font-size: 20px; font-weight: 700; margin: 0 }
.detail-header .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px }
.detail-kpi-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.detail-kpi {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
}
.detail-kpi .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px }
.detail-kpi .value { font-size: 20px; font-weight: 700 }

/* Chart container */
.chart-wrap {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
}
.chart-wrap h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px }
.chart-wrap canvas { width: 100%; height: 220px }

/* Detail tabs */
.detail-tabs {
  display: flex; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid var(--border);
}
.detail-tab {
  padding: 10px 16px; cursor: pointer; color: var(--text-muted);
  font-size: 13px; font-weight: 500; border-bottom: 2px solid transparent;
  transition: all .2s;
}
.detail-tab:hover { color: var(--text-dim) }
.detail-tab.active { color: var(--accent); border-bottom-color: var(--accent) }

/* Log lines */
.log-panel {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; max-height: 400px; overflow-y: auto;
  font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.7;
}
.log-line { color: var(--text-dim); white-space: pre-wrap; word-break: break-all }
.log-line .ts { color: var(--text-muted); margin-right: 8px }
.log-line.warn { color: var(--yellow) }
.log-line.error { color: var(--red) }

/* Clickable table rows */
tbody tr.clickable { cursor: pointer }
tbody tr.clickable:hover { background: var(--accent-glow) }

/* ── Responsive ── */
@media (max-width: 1024px) {
  .summary-row { grid-template-columns: repeat(2, 1fr) }
  .market-section { grid-template-columns: 1fr }
}
@media (max-width: 768px) {
  .header { padding: 0 16px }
  .tabs-bar { padding: 0 16px; overflow-x: auto }
  .content { padding: 20px 16px }
  .summary-row { grid-template-columns: 1fr 1fr }
  .metrics-grid { grid-template-columns: 1fr 1fr }
  .market-section { grid-template-columns: 1fr }
}
@media (max-width: 480px) {
  .summary-row { grid-template-columns: 1fr }
  .tabs-bar { gap: 0 }
  .tab { padding: 10px 12px; font-size: 12px }
}

/* ── Fade-in animation ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px) }
  to { opacity: 1; transform: translateY(0) }
}
.fade-in { animation: fadeUp .35s ease-out both }
.fade-in:nth-child(2) { animation-delay: .05s }
.fade-in:nth-child(3) { animation-delay: .1s }
.fade-in:nth-child(4) { animation-delay: .15s }

/* ── Notification Bell ── */
.bell-btn {
  position: relative; background: transparent; border: 1px solid var(--border-light);
  padding: 7px 10px; border-radius: 8px; cursor: pointer; color: var(--text-dim);
  display: flex; align-items: center; gap: 6px; transition: all .2s;
}
.bell-btn:hover { color: var(--text); border-color: var(--accent); background: var(--accent-glow) }
.bell-badge {
  position: absolute; top: -6px; right: -6px;
  background: var(--red); color: #fff; font-size: 10px; font-weight: 700;
  min-width: 18px; height: 18px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px; box-shadow: 0 2px 6px rgba(239,68,68,0.4);
}
.bell-badge.hidden { display: none }

/* ── Notification Panel ── */
.notif-panel {
  position: fixed; top: 64px; right: 32px; width: 420px; max-height: 70vh;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5); z-index: 100;
  display: none; flex-direction: column; overflow: hidden;
}
.notif-panel.open { display: flex }
.notif-panel-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.notif-panel-header h3 { font-size: 14px; font-weight: 600 }
.notif-panel-actions { display: flex; gap: 8px }
.notif-panel-actions button {
  background: transparent; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 12px; padding: 4px 8px; border-radius: 4px; transition: all .15s;
}
.notif-panel-actions button:hover { color: var(--accent); background: var(--accent-glow) }
.notif-list { overflow-y: auto; flex: 1; max-height: 60vh }
.notif-item {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .15s; display: flex; gap: 10px;
}
.notif-item:hover { background: var(--bg-card-hover) }
.notif-item.unread { background: rgba(59,130,246,0.04) }
.notif-item.unread::before {
  content: ''; width: 6px; height: 6px; border-radius: 3px;
  background: var(--accent); flex-shrink: 0; margin-top: 6px;
}
.notif-item.read::before {
  content: ''; width: 6px; height: 6px; flex-shrink: 0; margin-top: 6px;
}
.notif-body { flex: 1; min-width: 0 }
.notif-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.notif-detail { font-size: 12px; color: var(--text-dim); line-height: 1.5 }
.notif-detail .tag {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  font-size: 11px; font-weight: 600; margin-right: 4px;
}
.notif-detail .tag-buy { background: var(--green-bg); color: var(--green) }
.notif-detail .tag-sell { background: var(--red-bg); color: var(--red) }
.notif-detail .tag-live { background: rgba(59,130,246,0.1); color: var(--accent) }
.notif-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px }
.notif-empty { padding: 40px; text-align: center; color: var(--text-muted); font-size: 13px }

/* ── Toast ── */
.toast-container {
  position: fixed; top: 72px; right: 32px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px; max-width: 380px;
}
.toast {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  animation: toastIn .3s ease-out; cursor: pointer; position: relative;
}
.toast.closing { animation: toastOut .25s ease-in forwards }
@keyframes toastIn { from { opacity: 0; transform: translateX(30px) } to { opacity: 1; transform: translateX(0) } }
@keyframes toastOut { from { opacity: 1; transform: translateX(0) } to { opacity: 0; transform: translateX(30px) } }
.toast-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px }
.toast-title { font-size: 13px; font-weight: 700 }
.toast-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 0 4px }
.toast-body { font-size: 12px; color: var(--text-dim); line-height: 1.6 }
.toast-body .kv { display: flex; gap: 6px }
.toast-body .kv .k { color: var(--text-muted); min-width: 48px }
.toast-body .kv .v { color: var(--text); font-weight: 500 }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-container" id="toast-container"></div>
<script>
const API = '/api';
let token = '';
(function(){
  let t = localStorage.getItem('Access-Token') || '';
  if (t && typeof t === 'string') token = t;
  else if (t) { try { const o = JSON.parse(t); token = o.token || o.value || '' } catch {} }
})();
let currentTab = 'all';
let allData = null;
let lastUpdate = null;
let isRefreshing = false;
let notifications = [];
let lastNotifId = 0;
let notifPanelOpen = false;
let detailView = false;        // true = showing single strategy detail
let detailStrategyId = null;   // which strategy
let detailTab = 'positions';   // positions | trades | logs
let detailData = {};           // cached detail data
let detailLoading = false;

const REFRESH_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>`;

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401) { token = ''; localStorage.removeItem('Access-Token'); renderLogin(); throw new Error('Unauthorized') }
  return res.json();
}

async function login(username, password) {
  const res = await fetch(API + '/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();
  if (data.code === 1 && data.data?.token) { token = data.data.token; localStorage.setItem('Access-Token', token); loadData(); return true }
  return data.msg || 'Login failed';
}

async function loadData() {
  isRefreshing = true; renderHeader();
  try {
    const data = await api('/user/system-strategies?page=1&page_size=100');
    if (data.code === 1) {
      allData = data.data;
      lastUpdate = new Date();
      render();
      // Keep detail panels fresh while staying on a strategy
      if (detailView && detailStrategyId != null) {
        refreshDetailData(detailStrategyId);
      }
    }
    else { renderLogin(data.msg) }
  } catch (e) { renderLogin() }
  finally { isRefreshing = false; }
}

async function loadNotifications() {
  if (!token) return;
  try {
    const params = lastNotifId ? `?since_id=${lastNotifId}&limit=50` : '?limit=20';
    const res = await api('/strategies/notifications' + params);
    if (res.code === 1 && res.data?.items?.length) {
      const items = res.data.items;
      const newItems = items.filter(i => i.id > lastNotifId);
      if (lastNotifId > 0 && newItems.length > 0) {
        newItems.reverse().forEach(n => showToast(n));
      }
      if (lastNotifId === 0) {
        notifications = items;
      } else {
        notifications = [...items, ...notifications].slice(0, 100);
      }
      lastNotifId = Math.max(...items.map(i => i.id));
      renderBellBadge();
    }
  } catch (e) { /* silent */ }
}

function getUnreadCount() {
  return notifications.filter(n => !n.is_read).length;
}

function renderBellBadge() {
  const badge = document.querySelector('.bell-badge');
  if (!badge) return;
  const count = getUnreadCount();
  badge.textContent = count > 99 ? '99+' : String(count);
  badge.classList.toggle('hidden', count === 0);
}

function parseNotifPayload(n) {
  let p = {};
  try { p = typeof n.payload_json === 'string' ? JSON.parse(n.payload_json) : (n.payload_json || {}) } catch {}
  const strategy = p.strategy || {};
  const instrument = p.instrument || {};
  const sig = p.signal || {};
  const order = p.order || {};
  const trace = p.trace || {};
  return {
    strategyName: strategy.name || n.strategy_id || '',
    strategyId: strategy.id || n.strategy_id || 0,
    symbol: instrument.symbol || n.symbol || '',
    signalType: sig.type || n.signal_type || '',
    action: (sig.action || '').toUpperCase(),
    side: (sig.side || '').toUpperCase(),
    price: order.ref_price || 0,
    stake: order.stake_amount || 0,
    mode: trace.mode || '',
    pendingOrderId: trace.pending_order_id || '',
    status: (p.extra || {}).status || '',
  };
}

function showToast(n) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const p = parseNotifPayload(n);
  const isLong = p.side === 'LONG' || p.signalType?.includes('long');
  const sideTag = isLong ? '<span class="tag tag-buy">买入</span>' : '<span class="tag tag-sell">卖出</span>';
  const modeTag = p.mode === 'live' ? '<span class="tag tag-live">实盘</span>' : '';
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `
    <div class="toast-header">
      <span class="toast-title">${sideTag} ${modeTag} ${p.symbol || ''}</span>
      <button class="toast-close" onclick="this.parentElement.parentElement.classList.add('closing');setTimeout(()=>this.parentElement.parentElement.remove(),250)">&times;</button>
    </div>
    <div class="toast-body">
      <div class="kv"><span class="k">策略</span><span class="v">${p.strategyName || ''}</span></div>
      <div class="kv"><span class="k">信号</span><span class="v">${p.signalType || ''}</span></div>
      <div class="kv"><span class="k">价格</span><span class="v">${p.price ? Number(p.price).toLocaleString('zh-CN', {maximumFractionDigits:4}) : '--'}</span></div>
      <div class="kv"><span class="k">金额</span><span class="v">${p.stake ? Number(p.stake).toLocaleString('zh-CN', {maximumFractionDigits:0}) : '--'}</span></div>
      ${p.pendingOrderId ? `<div class="kv"><span class="k">委托ID</span><span class="v">${p.pendingOrderId}</span></div>` : ''}
    </div>`;
  toast.onclick = (e) => {
    if (e.target.classList.contains('toast-close')) return;
    markNotifRead(n.id);
    toast.classList.add('closing');
    setTimeout(() => toast.remove(), 250);
  };
  container.prepend(toast);
  setTimeout(() => { if (toast.parentElement) { toast.classList.add('closing'); setTimeout(() => toast.remove(), 250) } }, 8000);
}

async function markNotifRead(id) {
  try { await api('/strategies/notifications/read', { method: 'POST', body: JSON.stringify({ id }) }); } catch {}
  const n = notifications.find(x => x.id === id);
  if (n) { n.is_read = 1; renderBellBadge(); }
}

async function markAllRead() {
  try { await api('/strategies/notifications/read-all', { method: 'POST' }); } catch {}
  notifications.forEach(n => n.is_read = 1);
  renderBellBadge();
  renderNotifPanel();
}

function toggleNotifPanel() {
  notifPanelOpen = !notifPanelOpen;
  const panel = document.getElementById('notif-panel');
  if (panel) panel.classList.toggle('open', notifPanelOpen);
  if (notifPanelOpen) renderNotifPanel();
}

function renderNotifPanel() {
  const list = document.getElementById('notif-list');
  if (!list) return;
  if (!notifications.length) {
    list.innerHTML = '<div class="notif-empty">暂无通知</div>';
    return;
  }
  list.innerHTML = notifications.map(n => {
    const p = parseNotifPayload(n);
    const isLong = p.side === 'LONG' || p.signalType?.includes('long');
    const sideTag = isLong ? '<span class="tag tag-buy">买入</span>' : '<span class="tag tag-sell">卖出</span>';
    const modeTag = p.mode === 'live' ? '<span class="tag tag-live">实盘</span>' : '<span class="tag" style="background:rgba(139,157,195,0.1);color:var(--text-dim)">模拟</span>';
    const ts = n.created_at ? new Date(typeof n.created_at === 'number' ? n.created_at * 1000 : n.created_at).toLocaleString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
    return `<div class="notif-item ${n.is_read ? 'read' : 'unread'}" onclick="markNotifRead(${n.id})">
      <div class="notif-body">
        <div class="notif-title">${p.symbol} ${p.signalType}</div>
        <div class="notif-detail">${sideTag} ${modeTag} ${p.strategyName}</div>
        <div class="notif-detail">
          价格: ${p.price ? Number(p.price).toLocaleString('zh-CN', {maximumFractionDigits:4}) : '--'} &nbsp;
          金额: ${p.stake ? Number(p.stake).toLocaleString('zh-CN', {maximumFractionDigits:0}) : '--'}
          ${p.pendingOrderId ? ' &nbsp; 委托ID: ' + p.pendingOrderId : ''}
        </div>
        <div class="notif-meta">${ts} &middot; #${n.strategy_id || ''}</div>
      </div>
    </div>`;
  }).join('');
}

function fmt(n, dec = 2) { if (n == null) return '--'; return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) }
function pnlCls(n) { return n > 0 ? 'pnl-pos' : n < 0 ? 'pnl-neg' : '' }
function pnlSign(n) { return n > 0 ? '+' : '' }
function fmtTime(d) { if (!d) return ''; return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) }

// ─── Ranking helpers ───
function getRankedStrategies(items) {
  return (items || [])
    .filter(i => i.total_pnl != null || i.trade_count > 0)
    .slice()
    .sort((a, b) => {
      const roiA = a.roi || 0;
      const roiB = b.roi || 0;
      return roiB - roiA;
    })
    .slice(0, 6);
}

function renderRankingSection(items) {
  const ranked = getRankedStrategies(items);
  if (!ranked.length) return '';

// ─── Strategy Detail ───
function sameStrategyId(a, b) {
  const na = Number(a), nb = Number(b);
  return Number.isFinite(na) && Number.isFinite(nb) && na === nb;
}

function syncStrategyUrl(id, { replace = false } = {}) {
  const url = new URL(window.location);
  const cur = url.searchParams.get('strategyId');
  if (sameStrategyId(cur, id)) {
    // Already on this strategy — avoid stacking duplicate history entries
    if (replace) window.history.replaceState({}, '', url);
    return;
  }
  url.searchParams.set('strategyId', String(id));
  if (replace) window.history.replaceState({}, '', url);
  else window.history.pushState({}, '', url);
}

async function refreshDetailData(id) {
  const reqId = Number(id);
  if (!Number.isFinite(reqId)) return;
  try {
    const [perf, pos, trades, logs] = await Promise.all([
      api('/strategies/performance?id=' + reqId).catch(() => ({ code: 0 })),
      api('/strategies/positions?id=' + reqId).catch(() => ({ code: 0 })),
      api('/strategies/trades?id=' + reqId).catch(() => ({ code: 0 })),
      api('/strategies/logs?id=' + reqId).catch(() => ({ code: 0 })),
    ]);
    // Drop stale responses after navigate-away / switch strategy
    if (!detailView || !sameStrategyId(detailStrategyId, reqId)) return;
    detailData = {
      perf: perf.code === 1 ? perf.data : null,
      positions: pos.code === 1 ? (pos.data?.positions || []) : [],
      trades: trades.code === 1 ? (trades.data?.trades || []) : [],
      logs: logs.code === 1 ? (logs.data || []) : [],
    };
  } catch (e) {
    console.error('detail load error', e);
    if (!detailView || !sameStrategyId(detailStrategyId, reqId)) return;
  }
  if (!detailView || !sameStrategyId(detailStrategyId, reqId)) return;
  detailLoading = false;
  renderDetail();
}

window.showStrategyDetail = async function (id) {
  const sid = Number(id);
  if (!Number.isFinite(sid)) {
    console.warn('showStrategyDetail: invalid id', id);
    return;
  }
  detailView = true;
  detailStrategyId = sid;
  detailTab = 'positions';
  detailData = {};
  detailLoading = true;
  renderDetail();

  // Deep-link / same-id re-entry: replace; fresh navigation: push
  const cur = new URL(window.location).searchParams.get('strategyId');
  syncStrategyUrl(sid, { replace: sameStrategyId(cur, sid) });

  await refreshDetailData(sid);
};

window.backToList = function () {
  detailView = false;
  detailStrategyId = null;
  detailData = {};
  detailLoading = false;
  const url = new URL(window.location);
  url.searchParams.delete('strategyId');
  window.history.pushState({}, '', url);
  render();
};

window.switchDetailTab = function (t) {
  detailTab = t;
  renderDetail();
};

function findStrategyById(id) {
  if (!allData || !allData.items) return null;
  const nid = Number(id);
  if (!Number.isFinite(nid)) return null;
  return allData.items.find(i => Number(i.id) === nid) || null;
}

function renderDetail() {
  const st = findStrategyById(detailStrategyId);
  if (!st) {
    document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="header-left">
        <h1><span>Chan</span>Quant</h1>
      </div>
      <div class="header-right">
        <button class="btn-refresh" onclick="backToList()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          返回列表
        </button>
      </div>
    </div>
    <div class="content"><div class="empty-state">策略未找到</div></div>`;
    return;
  }

  const name = (st.strategy_name || st.indicator_name || '-').replace('CZSC v3 - ', '');
  const perf = detailData.perf || {};
  const positions = detailData.positions || [];
  const trades = detailData.trades || [];
  const logs = detailData.logs || [];
  const isCrypto = st.market_category === 'Crypto';
  const ccy = isCrypto ? '$' : '¥';

  // KPI
  const totalReturn = perf.total_return || st.total_pnl || 0;
  const totalReturnPct = perf.total_return_pct || st.roi || 0;
  const maxDD = perf.max_drawdown || 0;
  const maxDDPct = perf.max_drawdown_pct || 0;
  const latestEquity = perf.latest_equity || (st.initial_capital + totalReturn);

  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="header">
    <div class="header-left">
      <h1><span>Chan</span>Quant</h1>
      <div class="pulse-dot" title="系统运行中"></div>
    </div>
    <div class="header-right">
      <button class="btn-refresh" onclick="backToList()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        返回列表
      </button>
    </div>
  </div>
  <div class="content detail-view">
    <div class="detail-header">
      <div class="detail-header-left">
        <div>
          <h2>${name}</h2>
          <div class="subtitle">#${st.id} · ${st.symbol || '-'} · ${st.timeframe || '-'} · <span class="mode-tag ${st.execution_mode === 'live' ? 'live' : 'signal'}">${st.execution_mode === 'live' ? '实盘' : '模拟'}</span> · <span class="status-pill ${st.status === 'running' ? 'pill-running' : 'pill-stopped'}"><span class="dot"></span>${st.status === 'running' ? '运行中' : '已停止'}</span></div>
        </div>
      </div>
    </div>

    <div class="detail-kpi-row">
      <div class="detail-kpi">
        <div class="label">初始资金</div>
        <div class="value">${ccy}${fmt(st.initial_capital)}</div>
      </div>
      <div class="detail-kpi">
        <div class="label">当前权益</div>
        <div class="value">${ccy}${fmt(latestEquity)}</div>
      </div>
      <div class="detail-kpi">
        <div class="label">总收益</div>
        <div class="value ${totalReturn >= 0 ? 'pnl-pos' : 'pnl-neg'}">${totalReturn >= 0 ? '+' : ''}${ccy}${fmt(totalReturn, 4)} (${totalReturnPct >= 0 ? '+' : ''}${fmt(totalReturnPct)}%)</div>
      </div>
      <div class="detail-kpi">
        <div class="label">最大回撤</div>
        <div class="value pnl-neg">${ccy}${fmt(maxDD, 2)} (${fmt(maxDDPct)}%)</div>
      </div>
      <div class="detail-kpi">
        <div class="label">交易次数</div>
        <div class="value">${st.trade_count || 0}</div>
      </div>
      <div class="detail-kpi">
        <div class="label">杠杆</div>
        <div class="value">${st.leverage || 1}x</div>
      </div>
    </div>

    ${detailLoading ? '<div class="empty-state">加载中...</div>' : `
    <div class="chart-wrap">
      <h3>📈 权益曲线</h3>
      <canvas id="equityChart" height="220"></canvas>
    </div>

    <div class="detail-tabs">
      <div class="detail-tab ${detailTab === 'positions' ? 'active' : ''}" onclick="switchDetailTab('positions')">持仓 (${positions.length})</div>
      <div class="detail-tab ${detailTab === 'trades' ? 'active' : ''}" onclick="switchDetailTab('trades')">交易 (${trades.length})</div>
      <div class="detail-tab ${detailTab === 'logs' ? 'active' : ''}" onclick="switchDetailTab('logs')">日志 (${logs.length})</div>
    </div>

    ${detailTab === 'positions' ? renderDetailPositions(positions, ccy) : ''}
    ${detailTab === 'trades' ? renderDetailTrades(trades, ccy) : ''}
    ${detailTab === 'logs' ? renderDetailLogs(logs) : ''}
    `}
  </div>`;

  // Draw equity chart after DOM is ready
  if (!detailLoading && perf.equity_curve && perf.equity_curve.length > 1) {
    setTimeout(() => drawEquityChart(perf.equity_curve, isCrypto), 50);
  }
}

function renderDetailPositions(positions, ccy) {
  if (!positions.length) return '<div class="empty-state">暂无持仓</div>';
  return `<div class="table-wrap">
    <table><thead><tr>
      <th>品种</th><th>方向</th><th>数量</th><th>入场价</th><th>现价</th><th>未实现盈亏</th><th>盈亏%</th>
    </tr></thead><tbody>
    ${positions.map(p => `<tr>
      <td>${p.symbol || '-'}</td>
      <td>${(p.side || '').toUpperCase()}</td>
      <td>${fmt(p.size, 4)}</td>
      <td>${fmt(p.entry_price, 4)}</td>
      <td>${fmt(p.current_price, 4)}</td>
      <td class="${(p.unrealized_pnl||0) >= 0 ? 'pnl-pos' : 'pnl-neg'}">${(p.unrealized_pnl||0) >= 0 ? '+' : ''}${ccy}${fmt(p.unrealized_pnl, 4)}</td>
      <td class="${(p.pnl_percent||0) >= 0 ? 'pnl-pos' : 'pnl-neg'}">${(p.pnl_percent||0) >= 0 ? '+' : ''}${fmt(p.pnl_percent)}%</td>
    </tr>`).join('')}
    </tbody></table></div>`;
}

function renderDetailTrades(trades, ccy) {
  if (!trades.length) return '<div class="empty-state">暂无交易记录</div>';
  const recent = trades.slice(0, 50);
  return `<div class="table-wrap">
    <table><thead><tr>
      <th>时间</th><th>品种</th><th>类型</th><th>价格</th><th>数量</th><th>金额</th><th>盈亏</th>
    </tr></thead><tbody>
    ${recent.map(t => {
      const ts = t.created_at ? new Date(typeof t.created_at === 'number' ? t.created_at * 1000 : t.created_at).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';
      const profit = t.net_pnl != null ? t.net_pnl : (t.profit || 0);
      return `<tr>
        <td class="text-dim">${ts}</td>
        <td>${t.symbol || '-'}</td>
        <td>${(t.type || '').toUpperCase()}</td>
        <td>${fmt(t.price, 4)}</td>
        <td>${fmt(t.amount, 4)}</td>
        <td>${ccy}${fmt(t.value, 2)}</td>
        <td class="${profit >= 0 ? 'pnl-pos' : 'pnl-neg'}">${profit !== 0 ? (profit >= 0 ? '+' : '') + ccy + fmt(profit, 4) : '--'}</td>
      </tr>`;
    }).join('')}
    </tbody></table>
    ${trades.length > 50 ? '<div style="padding:12px 16px;text-align:center;color:var(--text-muted);font-size:12px">显示最近 50 条，共 ' + trades.length + ' 条</div>' : ''}
  </div>`;
}

function renderDetailLogs(logs) {
  if (!logs.length) return '<div class="empty-state">暂无日志</div>';
  return `<div class="log-panel">
    ${logs.slice(0, 200).map(l => {
      const lvl = (l.level || '').toLowerCase();
      const cls = lvl === 'warn' || lvl === 'warning' ? 'warn' : lvl === 'error' ? 'error' : '';
      const ts = l.timestamp ? String(l.timestamp).slice(11, 19) || '' : '';
      return `<div class="log-line ${cls}"><span class="ts">${ts}</span>${(l.message || '').replace(/</g,'&lt;')}</div>`;
    }).join('')}
  </div>`;
}

function drawEquityChart(curve, isCrypto) {
  const canvas = document.getElementById('equityChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const pad = { top: 10, right: 12, bottom: 30, left: 60 };

  const values = curve.map(p => p.equity || 0);
  const times = curve.map(p => p.time || 0);
  const minV = Math.min(...values);
  const maxV = Math.max(...values);
  const range = maxV - minV || 1;
  const minT = times[0] || 0;
  const maxT = times[times.length - 1] || 1;
  const tRange = maxT - minT || 1;

  const ccy = isCrypto ? '$' : '¥';

  // Grid
  ctx.strokeStyle = 'rgba(42,58,77,0.5)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (H - pad.top - pad.bottom) * i / 4;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
    const val = maxV - range * i / 4;
    ctx.fillStyle = '#5a6a82'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(ccy + fmt(val, 0), pad.left - 6, y + 3);
  }

  // Time labels
  ctx.fillStyle = '#5a6a82'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  const labelCount = Math.min(6, curve.length);
  for (let i = 0; i < labelCount; i++) {
    const idx = Math.floor(i * (curve.length - 1) / (labelCount - 1));
    const t = times[idx];
    if (!t) continue;
    const d = new Date(typeof t === 'number' && t < 1e12 ? t * 1000 : t);
    const label = d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
    const x = pad.left + (W - pad.left - pad.right) * idx / (curve.length - 1 || 1);
    ctx.fillText(label, x, H - pad.bottom + 16);
  }

  // Line
  const isProfit = values[values.length - 1] >= values[0];
  const lineColor = isProfit ? '#22c55e' : '#ef4444';
  const fillColor = isProfit ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.08)';

  ctx.beginPath();
  curve.forEach((p, i) => {
    const x = pad.left + (W - pad.left - pad.right) * i / (curve.length - 1 || 1);
    const y = pad.top + (H - pad.top - pad.bottom) * (1 - (p.equity - minV) / range);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = lineColor; ctx.lineWidth = 2; ctx.stroke();

  // Fill area
  const lastX = pad.left + (W - pad.left - pad.right);
  const baseY = pad.top + (H - pad.top - pad.bottom);
  ctx.lineTo(lastX, baseY);
  ctx.lineTo(pad.left, baseY);
  ctx.closePath();
  ctx.fillStyle = fillColor; ctx.fill();
}

setInterval(() => { if (token) loadData() }, 30000);
setInterval(() => { if (token) loadNotifications() }, 5000);

// Event delegation: ranking cards / table rows (more reliable than inline onclick alone)
document.addEventListener('click', (ev) => {
  const el = ev.target && ev.target.closest && ev.target.closest('[data-strategy-id]');
  if (!el) return;
  const sid = Number(el.getAttribute('data-strategy-id'));
  if (!Number.isFinite(sid)) return;
  ev.preventDefault();
  showStrategyDetail(sid);
});

// Handle browser back/forward
window.addEventListener('popstate', () => {
  const sid = new URL(window.location).searchParams.get('strategyId');
  if (sid && allData) { showStrategyDetail(Number(sid)); }
  else if (detailView) { detailView = false; detailStrategyId = null; detailData = {}; detailLoading = false; render(); }
});

if (token) {
  loadData().then(() => {
    const sid = new URL(window.location).searchParams.get('strategyId');
    if (sid && allData) { showStrategyDetail(Number(sid)); }
  });
  loadNotifications();
} else { renderLogin() }
</script>
